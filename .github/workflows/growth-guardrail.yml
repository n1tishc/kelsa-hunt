name: growth-guardrail

on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - sources.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pack full Git history
        run: git gc

      - name: Measure growth and enforce the expansion gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          python growth_guardrail.py --baseline-ref "$BASE_REF"
