name: job-alert

on:
  schedule:
    # Best-effort every 30 min during weekday Bay Area working hours.
    - cron: "17,47 14-23 * * 1-5"
    # Every two hours outside that window; avoid the start of the hour.
    - cron: "17 0-12/2 * * 1-5"
    - cron: "17 */2 * * 0,6"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed state without alerting (use on first run)"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs post at once — that causes duplicate pings.
concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for new roles
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python job_alert.py scan ${{ inputs.seed && '--seed' || '' }}

      - name: Persist state
        if: always()
        run: |
          git config user.name  "job-alert-bot"
          git config user.email "actions@github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
