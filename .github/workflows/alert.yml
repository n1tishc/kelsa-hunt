name: job-alert

on:
  schedule:
    # Best-effort every 30 min during weekday Bay Area working hours.
    - cron: "17,47 14-23 * * 1-5"
    # Every two hours outside that window; avoid the start of the hour.
    - cron: "17 0-12/2 * * 1-5"
    - cron: "17 */2 * * 0,6"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed state without alerting (use on first run)"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two runs post at once — that causes duplicate pings.
concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      contents: write
    outputs:
      store_changed: ${{ steps.persist.outputs.store_changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for new roles
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python job_alert.py scan ${{ inputs.seed && '--seed' || '' }}

      - name: Persist state
        id: persist
        if: always()
        run: |
          if git diff --quiet -- jobs.json; then
            echo "store_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "job-alert-bot"
          git config user.email "actions@github.com"
          git add jobs.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "store_changed=true" >> "$GITHUB_OUTPUT"

  dashboard:
    needs: scan
    if: ${{ always() && needs.scan.outputs.store_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build strict-US ledger
        run: |
          python scripts/build_dashboard.py jobs.json "$RUNNER_TEMP/job-ledger"

      - uses: actions/configure-pages@v5

      - name: Upload ledger artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/job-ledger

  deploy:
    needs: dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ledger to Pages
        id: deployment
        uses: actions/deploy-pages@v4
