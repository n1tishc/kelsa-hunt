name: job-alert

on:
  schedule:
    # Every 15 min during Bay Area working hours (14:00-23:59 UTC = 7am-4pm PT), weekdays
    - cron: "*/15 14-23 * * 1-5"
    # Safety net every 2 hours the rest of the time
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed state without alerting (use on first run)"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs post at once — that causes duplicate pings.
concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for new roles
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python job_alert.py scan ${{ inputs.seed && '--seed' || '' }}

      - name: Persist state
        run: |
          git config user.name  "job-alert-bot"
          git config user.email "actions@github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push